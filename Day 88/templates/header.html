<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>HueLocal - Khám phá địa điểm ngon</title>

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Link CSS (Flask url_for) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="{{ body_class if body_class is defined else '' }}">

  <!-- BEGIN: Navigation Bar -->
  <nav class="navbar">
    <!-- Logo -->
    <a class="nav-logo" href="/">
      <span class="material-symbols-outlined logo-icon">fort</span>
      <span class="logo-text">HueLocal</span>
    </a>

    <!-- Nav Links (Desktop) -->
    <div class="nav-links">
      <a class="nav-link" href="#">
        <span class="material-symbols-outlined">add</span>
        ADD
      </a>
      <a class="nav-link" href="#">
        <span class="material-symbols-outlined">group</span>
        JOIN COMMUNITY
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" aria-label="Menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </nav>
  <!-- END: Navigation Bar -->
